seed: 2026
output_dir: outputs/vlm_smoke

data:
  source_root: dataset/anomaly_db_v1
  split_file_suffix: ""
  image_subdir: images_plain_768x384
  include_grounding_records: true
  include_qa_pairs: false
  include_indexed_series_text: true
  indexed_series_precision: 4
  indexed_series_compact: true
  max_train_samples: 4
  max_val_samples: 4
  max_test_samples: 4
  balanced_by_type: true
  series_normalization:
    enabled: false

model:
  model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  trust_remote_code: false
  processor_kwargs: {}
  from_pretrained_kwargs:
    torch_dtype: bfloat16

prompt:
  system_prompt: >-
    You are a vision-language anomaly grounding model for time-series plots.
    Read the input PNG plot and return exactly one JSON object with two keys:
    evidence and summary. Evidence must be a list whose items contain start,
    end, type, strength, and direction. Type must be one of point, freq, trend,
    or range. If no anomaly is detected, return {"evidence": [], "summary":
    "No anomaly is detected."}. Do not output markdown or extra text.
  user_prompt: >-
    Inspect this plain time-series plot and the indexed values. Return one JSON
    object with structured evidence and one English summary sentence.

training:
  mode: prepare_only
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.00001
  num_train_epochs: 1
  logging_steps: 1
  save_steps: 10
  eval_steps: 10
  evaluation_strategy: steps
  save_strategy: steps
  bf16: false
  fp16: false
  gradient_checkpointing: false
  load_best_model_at_end: false
  evidence_loss_weight: 0.0
  summary_semantic_loss_weight: 0.0
  generation_eval: false
